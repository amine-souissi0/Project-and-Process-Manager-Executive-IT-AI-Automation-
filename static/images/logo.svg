<svg width="200" height="60" xmlns="http://www.w3.org/2000/svg">
  <!-- Teal gradient shape (left, behind) -->
  <defs>
    <linearGradient id="tealGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2dd4bf;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d9488;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="orangeGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fb923c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f97316;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Teal shape (left, behind) -->
  <ellipse cx="35" cy="30" rx="25" ry="20" fill="url(#tealGradient)" opacity="0.9" transform="rotate(-15 35 30)"/>
  
  <!-- Orange shape (right, in front) -->
  <ellipse cx="55" cy="30" rx="25" ry="20" fill="url(#orangeGradient)" opacity="0.9" transform="rotate(15 55 30)"/>
  
  <!-- Text: Ulink Assist -->
  <text x="90" y="25" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#000000">Ulink</text>
  <text x="90" y="42" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#000000">Assist</text>
</svg>

